<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur de Moyenne Avancé</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="moyenne.css">
</head>
<body>
    <div class="container">
        <h1>Calculateur de Moyenne</h1>
        
        <div class="input-group">
            <input type="number" id="note" placeholder="Note (ex: 15)" min="0" max="20" step="0.25">
            <input type="number" id="coef" placeholder="Coef (ex: 1)" min="0.1" step="0.1" value="1">
            <button onclick="ajouterNote()">Ajouter</button>
        </div>

        <ul class="notes-list" id="listeNotes">
            <li class="empty-msg">Aucune note ajoutée pour le moment.</li>
        </ul>

        <div class="actions">
            <button class="btn-calc" onclick="calculerMoyenne()">Calculer</button>
            <button class="btn-clear" onclick="reinitialiser()">Effacer tout</button>
        </div>

        <div class="result-box">
            <div class="moyenne" id="resultat">Moyenne : --/20</div>
        </div>
    </div>

    <script src="Moyenne.js"></script>
</body>
</html>
